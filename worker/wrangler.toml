name = "catapulte-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"

# Storage + queue + scheduling live in ONE SQLite-backed Durable Object — no
# D1, no Queues, no cron. The DO's schema is created in code (init_schema).
[[durable_objects.bindings]]
name = "CATAPULTE_STORE"
class_name = "CatapulteStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CatapulteStore"]

# Email Service send binding used by deliver(). The sender domain must be
# configured/verified in your Cloudflare account.
[[send_email]]
name = "EMAIL"

[observability]
enabled = true
head_sampling_rate = 1.0
