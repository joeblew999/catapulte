# Standalone (excluded from the native workspace): the wasm32 Cloudflare
# Workers entrypoint. Built with `worker-build` (see wrangler.toml), not the
# native `cargo build --workspace`.
[package]
name = "catapulte-worker"
version = "2.0.0"
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8" }
# Required directly because the #[durable_object] macro emits bare
# `wasm_bindgen` paths in its generated glue.
wasm-bindgen = "0.2"
anyhow = "1"
catapulte-domain = { path = "../domain" }
catapulte-outbound-do = { path = "../adapter/outbound-do" }
catapulte-outbound-attachment-r2 = { path = "../adapter/outbound-attachment-r2" }
base64 = "0.22"
# The real HTTP surface, reused (no `server` feature → just router()).
catapulte-inbound-http = { path = "../adapter/inbound-http", default-features = false }
# Serve the axum Router inside the DO: ServiceExt::oneshot + Body.
axum = { version = "0.8", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "js"] }
url = "2"
# Rendering on wasm: MRML (MJML→HTML) with async parse so <mj-include> partials
# resolve via worker::Fetch; minijinja for variable interpolation. Pure-Rust.
mrml = { version = "6.0.1", default-features = false, features = ["parse", "render", "async"] }
async-trait = "0.1"
send_wrapper = "0.6"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
# wasm randomness backend for transitive users of getrandom 0.2.
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
