# Standalone (excluded from the native workspace): the wasm32 Cloudflare
# Workers entrypoint. Built with `worker-build` (see wrangler.toml), not the
# native `cargo build --workspace`.
[package]
name = "catapulte-worker"
version = "2.0.0"
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8" }
# Required directly because the #[durable_object] macro emits bare
# `wasm_bindgen` paths in its generated glue.
wasm-bindgen = "0.2"
catapulte-domain = { path = "../domain" }
catapulte-outbound-do = { path = "../adapter/outbound-do" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Rendering on wasm: MRML (MJML→HTML, parse+render only — no fs/http loaders)
# and minijinja for variable interpolation. Both are pure-Rust, wasm-clean.
mrml = { version = "6.0.1", default-features = false, features = ["parse", "render"] }
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
# wasm randomness backend for transitive users of getrandom 0.2.
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
