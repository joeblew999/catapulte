# Standalone (excluded from the native workspace): wasm32-only, built via the
# worker crate. Versions are pinned explicitly rather than inherited because
# excluded packages can't use `workspace = true`.
[package]
name = "catapulte-outbound-d1"
version = "2.0.0"
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1"
catapulte-domain = { path = "../../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "js"] }
worker = { version = "0.8", features = ["d1"] }
# Bridges the Workers !Send D1 handle/futures to the domain ports (Send + Sync).
# Sound because Workers run single-threaded.
send_wrapper = "0.6"
